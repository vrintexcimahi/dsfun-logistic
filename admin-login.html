<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Masuk Administrator | DS Fun Logistic</title>
  <meta name="description" content="Portal Autentikasi Khusus Administrator DS Fun Logistic">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="stylesheet" href="assets/css/style.css?v=3.4">
  <style>
    /* Executive Dark / Sleek Theme for Admin Login */
    :root {
      --login-bg: #070B14;
      --login-card-bg: rgba(15, 23, 42, 0.85);
      --login-card-border: rgba(255, 255, 255, 0.12);
      --accent-red: #D0021B;
      --accent-blue: #0A4FC4;
      --text-muted: #94A3B8;
    }

    body.login-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: var(--login-bg);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(208, 2, 27, 0.18) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(10, 79, 196, 0.22) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.7) 0%, transparent 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: clamp(16px, 3vw, 32px);
      position: relative;
      overflow-x: hidden;
      margin: 0;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      z-index: 2;
    }

    .login-card {
      background: var(--login-card-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--login-card-border);
      border-radius: clamp(20px, 3vw, 28px);
      padding: clamp(26px, 4vw, 40px);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.06);
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3.5px;
      background: linear-gradient(90deg, var(--accent-red), var(--accent-blue));
    }

    .login-header {
      text-align: center;
      margin-bottom: 26px;
      user-select: none;
    }

    .login-logo-wrap {
      display: inline-block;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 14px;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), background 0.2s ease;
    }

    .login-logo-wrap img {
      height: 48px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    .admin-exclusive-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(208, 2, 27, 0.16);
      border: 1px solid rgba(208, 2, 27, 0.35);
      color: #FF8080;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .login-title {
      font-size: clamp(20px, 2.4vw, 24px);
      font-weight: 800;
      color: #ffffff;
      margin: 0 0 6px 0;
      letter-spacing: -0.5px;
    }

    .login-subtitle {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.5;
      margin: 0;
    }

    /* Form Fields */
    .form-group-login {
      margin-bottom: 18px;
      text-align: left;
    }

    .form-group-login label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: #CBD5E1;
      margin-bottom: 7px;
      letter-spacing: 0.2px;
    }

    .input-icon-wrap {
      position: relative;
    }

    .input-icon-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 17px;
      height: 17px;
      fill: #64748B;
      transition: fill 0.2s ease;
      pointer-events: none;
    }

    .input-login {
      width: 100%;
      padding: 12px 14px 12px 42px;
      background: rgba(10, 16, 32, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
      transition: all 0.2s ease;
    }

    .input-login:focus {
      border-color: var(--accent-blue);
      background: rgba(10, 16, 32, 0.9);
      box-shadow: 0 0 0 3px rgba(10, 79, 196, 0.3);
    }

    .btn-submit-login {
      width: 100%;
      padding: 13px 20px;
      background: linear-gradient(135deg, var(--accent-red) 0%, #B00216 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(208, 2, 27, 0.45);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      margin-top: 22px;
    }

    .btn-submit-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(208, 2, 27, 0.6);
      background: linear-gradient(135deg, #E00320 0%, #C00219 100%);
    }

    .btn-submit-login:active {
      transform: translateY(0);
    }

    /* Error Message Alert */
    .login-error-msg {
      display: none;
      padding: 10px 14px;
      background: rgba(208, 2, 27, 0.18);
      border: 1px solid rgba(208, 2, 27, 0.4);
      border-radius: 10px;
      color: #FECACA;
      font-size: 13px;
      margin-bottom: 18px;
      text-align: left;
      animation: shakeCard 0.4s ease;
    }

    @keyframes shakeCard {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    /* Back Link & Footer */
    .login-footer-links {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
    }

    .login-footer-links a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .login-footer-links a:hover {
      color: #ffffff;
    }

    .easter-egg-copyright {
      margin-top: 28px;
      text-align: center;
      font-size: 12px;
      color: rgba(148, 163, 184, 0.5);
      user-select: none;
    }
  </style>
</head>
<body class="login-page">

  <div class="login-container">
    <div class="login-card" id="loginCard">
      
      <!-- Header -->
      <div class="login-header">
        <div class="login-logo-wrap">
          <img src="assets/img/logo.png" alt="DS Fun Logistic Logo">
        </div>
        <div>
          <span class="admin-exclusive-badge">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
            Akses Khusus Administrator
          </span>
        </div>
        <h1 class="login-title">Portal Masuk Administrator</h1>
        <p class="login-subtitle">Sistem Manajemen Konten &amp; Operasional DS Fun Logistic</p>
      </div>

      <!-- Error Message -->
      <div class="login-error-msg" id="loginErrorMsg"></div>

      <!-- Form Login Khusus Admin -->
      <form id="loginForm" autocomplete="off">
        <div class="form-group-login">
          <label for="usernameInput">Username Administrator</label>
          <div class="input-icon-wrap">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <input type="text" id="usernameInput" class="input-login" placeholder="Masukkan username administrator" required autofocus>
          </div>
        </div>

        <div class="form-group-login">
          <label for="passwordInput">Kata Sandi</label>
          <div class="input-icon-wrap">
            <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            <input type="password" id="passwordInput" class="input-login" placeholder="Masukkan kata sandi" required>
          </div>
        </div>

        <button type="submit" class="btn-submit-login" id="btnSubmitLogin">
          <span id="btnSubmitText">Masuk ke Dashboard CMS</span>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M5 13h11.86l-5.43 5.43 1.42 1.42L21.14 12l-8.29-7.85-1.42 1.42 5.43 5.43H5v2z"/></svg>
        </button>
      </form>

      <div class="login-footer-links">
        <a href="/">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
          Kembali ke Beranda DS Fun Logistic
        </a>
      </div>

    </div>

    <p class="easter-egg-copyright">
      PT DS Fun Logistic Indonesia &copy; 2026 · Hak Cipta Dilindungi
    </p>
  </div>

  <!-- Android Style Floating Toast Container -->
  <div id="dsfun-android-toast" class="dsfun-android-toast"></div>

  <!-- Scripts -->
  <script src="assets/js/easter-egg.js?v=3.4"></script>
  <script>
    (function () {
      'use strict';

      const usernameInput = document.getElementById('usernameInput');
      const passwordInput = document.getElementById('passwordInput');
      const btnSubmitText = document.getElementById('btnSubmitText');
      const loginForm = document.getElementById('loginForm');
      const loginErrorMsg = document.getElementById('loginErrorMsg');

      // Check if already authenticated
      if (sessionStorage.getItem('dsfun_admin_token')) {
        window.location.href = 'admin-dashboard.html';
        return;
      }

      // Form submission
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        loginErrorMsg.style.display = 'none';

        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();

        const btn = document.getElementById('btnSubmitLogin');
        btn.disabled = true;
        btnSubmitText.textContent = 'Memverifikasi Administrator...';

        try {
          const resp = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });

          const data = await resp.json();

          if (data.success) {
            sessionStorage.setItem('dsfun_admin_token', data.token);
            sessionStorage.setItem('dsfun_admin_user', JSON.stringify(data.user));
            sessionStorage.setItem('admin_unlocked', 'true');
            sessionStorage.setItem('app_admin_unlocked', 'true');
            
            if (window.DSFunEasterEgg) {
              window.DSFunEasterEgg.showToast('🎉 Login Berhasil! Membuka Dashboard CMS...', 'success');
            }

            setTimeout(() => {
              window.location.href = 'admin-dashboard.html';
            }, 600);
          } else {
            loginErrorMsg.textContent = data.message || 'Kredensial administrator tidak cocok.';
            loginErrorMsg.style.display = 'block';
            btn.disabled = false;
            btnSubmitText.textContent = 'Masuk ke Dashboard CMS';
          }
        } catch (err) {
          // Client-side fallback if server api offline
          if ((username.toLowerCase() === 'admin' && (password === 'admin' || password === 'admin123')) || (username.toLowerCase() === 'vrintex' && password === 'kayaraya3+')) {
            sessionStorage.setItem('dsfun_admin_token', 'local_token_' + Date.now());
            sessionStorage.setItem('dsfun_admin_user', JSON.stringify({ username, role: 'admin', name: 'Administrator' }));
            sessionStorage.setItem('admin_unlocked', 'true');
            if (window.DSFunEasterEgg) {
              window.DSFunEasterEgg.showToast('🎉 Login Berhasil! Membuka Dashboard CMS...', 'success');
            }
            setTimeout(() => {
              window.location.href = 'admin-dashboard.html';
            }, 600);
          } else {
            loginErrorMsg.textContent = 'Gagal menghubungi server otentikasi.';
            loginErrorMsg.style.display = 'block';
            btn.disabled = false;
            btnSubmitText.textContent = 'Masuk ke Dashboard CMS';
          }
        }
      });
    })();
  </script>
</body>
</html>
